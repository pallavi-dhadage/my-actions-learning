name: Run Python Script

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '0 * * * *'
  # NEW: This line creates a manual "Run workflow" button in your UI
  workflow_dispatch:

jobs:
  run-python-job:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute script
        run: python check_status.py
