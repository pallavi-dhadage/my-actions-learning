name: Run Python Script

# Triggers define when the script runs
on:
  push:
    branches: [ "main" ]
  schedule:
    # This syntax tells GitHub to run this script at minute 0 of every hour
    - cron: '0 * * * *'

jobs:
  run-python-job:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute script
        run: python check_status.py
